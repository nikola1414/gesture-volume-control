name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gesture and volume logic needs no camera libraries, so only the test tools are installed.
      # The MediaPipe smoke test skips itself when OpenCV/MediaPipe are absent.
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -v
